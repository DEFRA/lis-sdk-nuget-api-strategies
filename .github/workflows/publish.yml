name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Publish NuGet packages
        uses: DEFRA/lis-github-actions/actions/publish-nuget@5f5557f64c1344efb6ed44e482452f9cfe6bea51 # v0.11.0
        with:
          version: ${{ github.ref_name }}
          nuget-username: ${{ secrets.NUGET_USERNAME }}
